# Build, test and deploy the API to the aaPanel server.
#
# The shape: GitHub builds and publishes the image, then SSHes in and tells the
# server to pull it. The server never sees the source or needs build tools, and
# a rollback is re-running this workflow against an older tag.
#
# Nothing deploys unless ruff, mypy and pytest all pass first.

name: Deploy API

on:
  push:
    branches: [main]
    # The desktop shell and docs live in the same repo; a README edit should
    # not redeploy the API.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual run, for redeploying without a commit or rolling back to a tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (blank = build this commit)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # Lower-cased at use: ghcr rejects capitals in a repository name, and the
  # GitHub org here has them.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. Gate ----------------------------------------------------------------
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    # A rollback deploys an image that already passed these on its way in.
    if: github.event.inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Types
        run: mypy app

      # The suite runs against in-memory SQLite (see tests/conftest.py), so no
      # database service is needed here.
      - name: Tests
        run: pytest -q

  # --- 2. Build ---------------------------------------------------------------
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.image_tag != '')
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag to deploy
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lower-case the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.resolve.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.resolve.outputs.build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create for this.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.resolve.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.resolve.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          # Layer cache in the registry: a deploy that only changes app code
          # reuses the dependency layer instead of reinstalling everything.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 3. Deploy --------------------------------------------------------------
  deploy:
    name: Deploy to aaPanel
    runs-on: ubuntu-latest
    needs: build
    # One deploy at a time; a second push waits rather than racing the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_API_URL }}

    steps:
      - name: Lower-case the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # The whole deploy is one SSH session: pull, migrate, restart, verify.
      # It fails loudly at the first step that does not work.
      - name: Pull, migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Deploying $IMAGE"

            # The compose file reads the image from this variable, so the same
            # file serves every version and a rollback is one line.
            grep -q '^LEADPILOT_IMAGE=' .env.deploy 2>/dev/null \
              && sed -i "s|^LEADPILOT_IMAGE=.*|LEADPILOT_IMAGE=$IMAGE|" .env.deploy \
              || echo "LEADPILOT_IMAGE=$IMAGE" >> .env.deploy

            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file .env.deploy pull api

            # Migrations run BEFORE the new container serves traffic: the app
            # does not migrate on startup, so a schema change would otherwise
            # meet code expecting it.
            docker compose --env-file .env.deploy run --rm api alembic upgrade head

            docker compose --env-file .env.deploy up -d --no-deps api

            # Old images accumulate fast; keep the disk from filling.
            docker image prune -f --filter "until=168h"

      - name: Verify it came back up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            # Readiness, not liveness: it proves the container can reach MySQL,
            # which is the failure this deploy is most likely to cause.
            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:${{ vars.API_PORT || 8000 }}/api/v1/health/ready; then
                echo ""
                echo "Healthy after ${attempt} attempt(s)."
                exit 0
              fi
              sleep 4
            done

            echo "API did not become ready. Recent logs:"
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose --env-file .env.deploy logs --tail 60 api
            exit 1
