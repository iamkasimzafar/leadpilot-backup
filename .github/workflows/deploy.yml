# Build, test and deploy the API to the aaPanel server.
#
# The shape: GitHub builds and publishes the image, then SSHes in and tells the
# server to pull it. The server never sees the source or needs build tools, and
# a rollback is re-running this workflow against an older tag.
#
# Nothing deploys unless ruff, mypy and pytest all pass first.
#
# This deploys onto a LIVE service, so the deploy step is written to fail
# safe: it records the image that is currently serving, and if the new one
# does not come back healthy it puts the old one back before failing the run.

name: Deploy API

on:
  push:
    branches: [main]
    # The desktop shell and docs live in the same repo; a README edit should
    # not redeploy the API.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual run, for redeploying without a commit or rolling back to a tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (blank = build this commit)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # Lower-cased at use: ghcr rejects capitals in a repository name, and the
  # GitHub org here has them.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. Gate ----------------------------------------------------------------
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    # A rollback deploys an image that already passed these on its way in.
    if: github.event.inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Types
        run: mypy app

      # The suite runs against in-memory SQLite (see tests/conftest.py), so no
      # database service is needed here.
      - name: Tests
        run: pytest -q

  # --- 2. Build ---------------------------------------------------------------
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.image_tag != '')
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag to deploy
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lower-case the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.resolve.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.resolve.outputs.build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create for this.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.resolve.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.resolve.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          # Layer cache in the registry: a deploy that only changes app code
          # reuses the dependency layer instead of reinstalling everything.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 3. Deploy --------------------------------------------------------------
  deploy:
    name: Deploy to aaPanel
    runs-on: ubuntu-latest
    needs: build
    # One deploy at a time; a second push waits rather than racing the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      # The compose file travels with the deploy, so how the stack runs on the
      # server is versioned here rather than hand-edited there. Base64 keeps
      # it intact through the SSH action's environment passing.
      - name: Package the compose file
        run: echo "COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)" >> "$GITHUB_ENV"

      # One SSH session for the whole deploy: pull, migrate, restart, verify,
      # and roll back if the verify fails. Splitting verification into its own
      # step would leave a broken container serving while the workflow moved
      # on, so it all lives here where the previous image is still in scope.
      - name: Pull, migrate, restart and verify
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          API_PORT: ${{ vars.API_PORT || 8000 }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE,API_PORT,REGISTRY_USER,REGISTRY_TOKEN,COMPOSE_B64
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # This account is not in the docker group, so every docker call
            # goes through passwordless sudo. `-n` makes a missing NOPASSWD
            # rule fail loudly instead of hanging on a password prompt with no
            # TTY to type into.
            d() { sudo -n docker "$@"; }
            dc() { sudo -n docker compose --env-file .env.deploy "$@"; }

            echo "Deploying $IMAGE"

            # The stack definition for this version of the code.
            echo "$COMPOSE_B64" | base64 -d | sudo -n tee docker-compose.yml >/dev/null

            # The compose file reads the image from this variable, so the same
            # file serves every version and a rollback is one line.
            touch .env.deploy
            PREVIOUS=$(grep -oP '^LEADPILOT_IMAGE=\K.*' .env.deploy || true)
            echo "Currently serving: ${PREVIOUS:-<none>}"

            if grep -q '^LEADPILOT_IMAGE=' .env.deploy; then
              sed -i "s|^LEADPILOT_IMAGE=.*|LEADPILOT_IMAGE=$IMAGE|" .env.deploy
            else
              echo "LEADPILOT_IMAGE=$IMAGE" >> .env.deploy
            fi

            # GITHUB_TOKEN dies with the workflow run, so it cannot be used to
            # pull from the server. A PAT with read:packages is required, and
            # a private package with no token fails here rather than in a
            # confusing way later.
            if [ -n "${REGISTRY_TOKEN:-}" ]; then
              echo "$REGISTRY_TOKEN" | d login ghcr.io -u "$REGISTRY_USER" --password-stdin
            else
              echo "No GHCR_TOKEN set; assuming the package is public." >&2
            fi

            # api, worker and beat share one image, so this pulls it once.
            dc pull api redis

            # Migrations run BEFORE the new containers serve traffic. `run
            # --rm` uses the new image, so this is the new code's migration
            # against the live database; RUN_MIGRATIONS=false keeps the
            # entrypoint from doing it a second time on the way in.
            dc run --rm -e RUN_MIGRATIONS=false api alembic upgrade head

            # All four together: the worker and beat run the same image as
            # the api and must move with it, or a task would import code the
            # api no longer has.
            dc up -d redis

            # A container started by hand (`docker run`) holds the name
            # leadpilot-api without belonging to this compose project, and
            # compose refuses to create one with the same name. Take it out of
            # the way -- renamed, not removed, so it is still there to go back
            # to -- only when it is not already compose's own.
            project=$(d inspect leadpilot-api --format '{{ index .Config.Labels "com.docker.compose.project" }}' 2>/dev/null || true)
            if d inspect leadpilot-api >/dev/null 2>&1 && [ -z "$project" ]; then
              echo "Retiring hand-started leadpilot-api container"
              d rm -f leadpilot-api-previous >/dev/null 2>&1 || true
              d stop leadpilot-api
              d rename leadpilot-api leadpilot-api-previous
            fi

            dc up -d --no-deps api worker beat

            # Readiness, not liveness: it proves the container can reach MySQL,
            # which is the failure this deploy is most likely to cause.
            healthy=0
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 5 "http://127.0.0.1:${API_PORT}/api/v1/health/ready"; then
                echo ""
                echo "Healthy after ${attempt} attempt(s)."
                healthy=1
                break
              fi
              sleep 4
            done

            # The worker has no port to probe; its own ping is the check. A
            # worker that cannot answer within a minute of starting would
            # never dispatch a monitor, which is a failed deploy too.
            if [ "$healthy" -eq 1 ]; then
              worker_ok=0
              for attempt in $(seq 1 12); do
                if dc exec -T worker celery -A app.tasks.celery_app inspect ping --timeout 10 >/dev/null 2>&1; then
                  echo "Worker answered after ${attempt} attempt(s)."
                  worker_ok=1
                  break
                fi
                sleep 5
              done
              if [ "$worker_ok" -ne 1 ]; then
                echo "::error::Celery worker never answered its ping."
                dc logs --tail 60 worker beat || true
                healthy=0
              fi
            fi

            if [ "$healthy" -ne 1 ]; then
              echo "::error::New image failed its readiness check."
              dc logs --tail 80 api || true

              if [ -n "$PREVIOUS" ]; then
                echo "Rolling back to $PREVIOUS"
                sed -i "s|^LEADPILOT_IMAGE=.*|LEADPILOT_IMAGE=$PREVIOUS|" .env.deploy
                dc up -d --no-deps api worker beat
                # The database is NOT rolled back. Migrations here are
                # additive, so the previous image tolerates the new schema;
                # a destructive migration would need a manual restore from
                # /root/leadpilot-backups.
                echo "::warning::Rolled back to the previous image. The schema was left migrated."
              else
                echo "::error::No previous image recorded; cannot roll back automatically."
              fi

              exit 1
            fi

            # Old images accumulate fast; keep the disk from filling. Runs
            # only on success, so a failed deploy leaves the rollback target
            # in place.
            d image prune -f --filter "until=168h"
